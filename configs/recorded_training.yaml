general:
  name: uncond_v2_feat_e500
  wandb: disabled
  gpus: 2
  resume: null
  test_only: null
  check_val_every_n_epochs: 25
  sample_every_val: 2
  val_check_interval: null
  samples_to_generate: 512
  samples_to_save: 20
  chains_to_save: 0
  log_every_steps: 50
  number_chain_steps: 50
  final_model_samples_to_generate: 10000
  final_model_samples_to_save: 30
  final_model_chains_to_save: 0
  evaluate_all_checkpoints: false
model:
  type: discrete
  transition: marginal
  model: graph_tf
  diffusion_steps: 500
  diffusion_noise_schedule: cosine
  n_layers: 6
  extra_features: all
  hidden_mlp_dims:
    X: 256
    E: 128
    'y': 128
  hidden_dims:
    dx: 256
    de: 64
    dy: 64
    n_head: 8
    dim_ffX: 256
    dim_ffE: 128
    dim_ffy: 128
  lambda_train:
  - 5
  - 0
train:
  n_epochs: 500
  batch_size: 16
  lr: 0.0001
  clip_grad: 1.0
  save_model: true
  num_workers: 4
  ema_decay: 0
  progress_bar: false
  weight_decay: 1.0e-12
  optimizer: adamw
  seed: 42
dataset:
  name: ao_phenolic_bde
  datadir: data/ao_phenolic_bde/
  remove_h: true
  pin_memory: false
